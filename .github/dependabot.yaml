# Dependabot version updates. Every option is documented at
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  # NOTE: The Python SDK is a member of the root uv workspace, which resolves every
  # member against the single top-level uv.lock — so this is rooted at / rather
  # than sdk/python.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # NOTE: the uv binary itself is pinned by `required-version` in the root
    # pyproject.toml, which must keep admitting the uv release Dependabot runs;
    # it is bumped by hand, never by an update PR.
    ignore:
      - dependency-name: uv
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  # NOTE: Dockerfiles are not discovered recursively, so every directory holding
  # one is listed: Dockerfile.fraise at the root, plus the example images.
  - package-ecosystem: docker
    directories:
      - /
      - /examples/claude-agent-sdk
      - /examples/openai-agents
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "
