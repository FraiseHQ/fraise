# Dependabot version updates. Every option is documented at
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  # The Python SDK is a member of the root uv workspace. Every member resolves
  # against the one top-level uv.lock, so this entry is rooted at /, not at
  # sdk/python.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # The uv binary is pinned by `required-version` in the root pyproject.toml.
    # The pin must keep admitting the uv release Dependabot runs. It is bumped
    # by hand, never by an update PR.
    ignore:
      - dependency-name: uv
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "

  # Dependabot does not find Dockerfiles recursively, so each directory that
  # holds one is listed: Dockerfile.fraise at the root, and the example images.
  - package-ecosystem: docker
    directories:
      - /
      - /examples/claude-agent-sdk
      - /examples/openai-agents
    schedule:
      interval: daily
    commit-message:
      prefix: "deps: "
      prefix-development: "deps: "
