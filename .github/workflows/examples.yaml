name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "sdk/python/**"
      - ".github/workflows/examples.yaml"
  pull_request:
    paths:
      - "examples/**"
      - "sdk/python/**"
      - ".github/workflows/examples.yaml"
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC, since the agent SDKs the images resolve release without commits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: "--locked"
      - name: Lint
        run: mise run lint:docker

  build:
    name: ${{ matrix.example }} (${{ matrix.runner }})
    needs: lint
    # The images install wheels per architecture, the Claude Agent SDK's with
    # the CLI binary inside it. So each example is built natively on both
    # architectures a user runs it on.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        example: [claude-agent-sdk, openai-agents, pydantic-ai]
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: "--locked"
      - name: Build the image
        run: mise run build:examples "$EXAMPLE"

  run:
    name: ${{ matrix.example }} (run)
    needs: build
    # An example whose script checks its own outcome runs end to end against
    # the fraise service its compose file brings up. The agent calls a hosted
    # model, so the run takes each provider's key from the repository secrets.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [pydantic-ai]
    env:
      EXAMPLE: ${{ matrix.example }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the example
        run: docker compose -f "examples/$EXAMPLE/docker-compose.yaml" run --rm agent
