name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "sdk/python/**"
      - ".github/workflows/examples.yaml"
  pull_request:
    paths:
      - "examples/**"
      - "sdk/python/**"
      - ".github/workflows/examples.yaml"
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC, since the agent SDKs the images resolve release without commits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version-file: "pyproject.toml"
      - name: Lint
        run: make lint-docker

  build:
    name: ${{ matrix.example }} (${{ matrix.runner }})
    needs: lint
    # The images install wheels per architecture, the Claude Agent SDK's with
    # the CLI binary inside it. So each example is built natively on both
    # architectures a user runs it on.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        example: [claude-agent-sdk, openai-agents]
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the image
        run: docker build -f "examples/$EXAMPLE/Dockerfile" .
