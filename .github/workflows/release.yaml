name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"            # server
      - "python/v[0-9]+.[0-9]+.[0-9]+"     # python sdk
      - "typescript/v[0-9]+.[0-9]+.[0-9]+" # typescript sdk

permissions:
  contents: write

jobs:
  # ---------------- server: v* ----------------
  test-go:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  publish-go:
    needs: test-go
    runs-on: ubuntu-latest
    environment: release # manual approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ---------------- python sdk: python/v* ----------------
  test-python:
    if: startsWith(github.ref_name, 'python/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version must match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python/v}"
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::tag $TAG_VERSION != pyproject $PKG_VERSION"; exit 1; }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  publish-python:
    needs: test-python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing — no token secret
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  # ---------------- typescript sdk: typescript/v* ----------------
  test-typescript:
    if: startsWith(github.ref_name, 'typescript/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Version must match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#typescript/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test

  publish-typescript:
    needs: test-typescript
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
