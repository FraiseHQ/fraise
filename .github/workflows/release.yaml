name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # release-please labels its PR (autorelease:*) via the Issues API
      pull-requests: write
    steps:
      # Keeps one open release PR, "chore: release main", for every component
      # with releasable commits: the server, the Python SDK and the MCP server.
      # Each component keeps its own version. Merging the PR tags each
      # component it bumps and creates that component's GitHub Release. So a
      # tag can never disagree with the version in the tree.
      #
      # The server, at the root, has no package-name in
      # release-please-config.json. Its tags carry no component, so it is
      # listed in the pull request without one. When it is the only
      # component a pull request releases, release-please checks that
      # missing component against the one package-name would configure.
      # With a package-name the two differ, and the merge tags nothing.
      #
      # token MUST be fraise-bot's, not the default GITHUB_TOKEN. A tag pushed
      # with GITHUB_TOKEN does not trigger other workflows. The publish job in
      # go.yaml would never fire, and the release would ship with no binaries.
      # The token is scoped to this repository and to what release-please
      # touches: the branch, commit, tag and release (contents), its PR, and
      # the autorelease:* labels (issues).
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: fraise-bot
        with:
          client-id: ${{ secrets.FRAISE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRAISE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.fraise-bot.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
