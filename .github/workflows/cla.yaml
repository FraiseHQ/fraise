name: CLA gate

on:
  # pull_request_target: the gate needs a write token to set the status and
  # comment on PRs from forks. It checks out nothing and runs no PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write   # the one "please sign" comment, edited in place
  statuses: write        # the cla/signed status on the PR head

jobs:
  cla:
    runs-on: ubuntu-latest
    # Pull request events, and every comment on a pull request. Whether a
    # comment is a signature is decided inside the action, so this condition
    # and the phrase cannot drift apart. Release and dependency PRs are not
    # skipped: bots are exempt, and a skipped job leaves cla/signed unset.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    steps:
      # GITHUB_TOKEN cannot write across repositories, so signatures are
      # committed to FraiseHQ/cla by fraise-bot, with a token scoped to that
      # repository and contents:write alone. fraise-bot[bot] is itself exempt
      # from the gate through the action's default `*[bot]` allowlist.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: fraise-bot
        with:
          client-id: ${{ secrets.FRAISE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRAISE_BOT_PRIVATE_KEY }}
          owner: FraiseHQ
          repositories: cla
          permission-contents: write
      - name: CLA gate
        uses: FraiseHQ/cla-gate-action@6c278daa979c0d9ef6bdb4464151e95fbecf1a9a # v2.0.0
        with:
          cla-url: https://github.com/FraiseHQ/cla/blob/main/cla.md
          signature-repo: FraiseHQ/cla
          signature-branch: main
          signature-path: signatures/v1/cla.json
          signature-token: ${{ steps.fraise-bot.outputs.token }}
