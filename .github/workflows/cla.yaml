name: CLA gate

on:
  # pull_request_target: the gate needs a write token to set the status and
  # comment on PRs from forks. It checks out nothing and runs no PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write   # the one "please sign" comment, edited in place
  statuses: write        # the cla/signed status on the PR head

jobs:
  cla:
    runs-on: ubuntu-latest
    # Pull request events, and every comment on a pull request. Whether a
    # comment is a signature is decided inside the action, so this condition
    # and the phrase cannot drift apart. Release and dependency PRs are not
    # skipped: bots are exempt, and a skipped job leaves cla/signed unset.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    steps:
      - name: CLA gate
        uses: FraiseHQ/cla-gate-action@REPLACE_WITH_NEW_SHA # v2.0.0
        with:
          cla-url: https://github.com/FraiseHQ/cla/blob/main/cla.md
          signature-repo: FraiseHQ/cla
          signature-branch: main
          signature-path: signatures/v1/cla.json
          signature-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
