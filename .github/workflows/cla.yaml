name: CLA gate

on:
  # pull_request_target: the gate needs a write token to set the status and
  # comment on PRs from forks. It checks out nothing and runs no PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write   # the one "please sign" comment, edited in place
  statuses: write        # the cla/signed status on the PR head

jobs:
  cla:
    runs-on: ubuntu-latest
    # Every pull request event, and only the comment that signs. Release and
    # dependency PRs are not skipped: their authors are allowlisted, and a
    # skipped job would leave the required cla/signed status unset.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA gate
        # No release yet: pinned to main as of adoption.
        uses: FraiseHQ/cla-gate-action@96bb509b7f172266b2e71555256242bfc5cd981c
        with:
          # the document contributors are agreeing to
          cla-url: https://github.com/FraiseHQ/cla/blob/main/cla.md
          # Signatures live in FraiseHQ/cla, next to the document they sign,
          # so one signature covers every repo in the org: signatures.json and
          # the optional allowlist.json on its main branch. GITHUB_TOKEN cannot
          # write across repositories, hence the PAT.
          signature-repo: FraiseHQ/cla
          signature-branch: main
          signature-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # The copyright holder grants no licence to themself; bots are exempt
          # by the action's default (*[bot]).
          allowlist: RonsenbergVI
