name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read         # signatures are written to FraiseHQ/cla via the PAT
  pull-requests: write   # comments on the PR
  statuses: write        # sets the blocking status check

jobs:
  cla:
    runs-on: ubuntu-latest
    # release-please's release PRs and dependabot's bumps carry no
    # contribution to license.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release-please') &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA and I hereby agree to its terms' ||
      github.event_name == 'pull_request_target')
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is scoped to this repo only; writing signatures to
          # FraiseHQ/cla needs a PAT with repo scope.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # Signatures live in FraiseHQ/cla, next to the document they sign,
          # so one signature record covers every repo in the org. The action
          # creates the file itself — creating it by hand makes the run fail —
          # but the branch must already exist and must not be protected.
          remote-organization-name: 'FraiseHQ'
          remote-repository-name: 'cla'
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'main'
          # the document contributors are agreeing to
          path-to-document: 'https://github.com/FraiseHQ/cla/blob/main/cla.md'
          # exact phrase a contributor comments to sign (must match the `if` above)
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before it can be merged, please read the
            [CLA](https://github.com/FraiseHQ/cla/blob/main/cla.md)
            and comment exactly:
          custom-pr-sign-comment: 'I have read the CLA and I hereby agree to its terms'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          allowlist: RonsenbergVI,dependabot[bot],renovate[bot],github-actions[bot]
