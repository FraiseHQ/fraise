name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # writes the signature file to the signatures branch
  pull-requests: write   # comments on the PR
  statuses: write        # sets the blocking status check

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA and I hereby agree to its terms' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # where signatures are stored (a branch in this repo)
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'cla-signatures'
          # the document contributors are agreeing to
          path-to-document: 'https://github.com/RonsenbergVI/agent-memory-benchmarks/blob/main/CLA.md'
          # exact phrase a contributor comments to sign (must match the `if` above)
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before it can be merged, please read the
            [CLA](https://github.com/RonsenbergVI/agent-memory-benchmarks/blob/main/CLA.md)
            and comment exactly:
          custom-pr-sign-comment: 'I have read the CLA and I hereby agree to its terms'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          # nobody who needs to sign: you, and bots
          allowlist: RonsenbergVI,dependabot[bot],renovate[bot],github-actions[bot]
