name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python.yaml"
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python.yaml"

permissions:
  contents: read

jobs:

  lint:
    name: Lint Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
    
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          python-version: ${{ matrix.python }}

      - name: Lint python ${{ matrix.python }}
        run: make lint-py

  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
    
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          python-version: ${{ matrix.python }}

      - name: Test with python ${{ matrix.python }}
        run: make test-py

