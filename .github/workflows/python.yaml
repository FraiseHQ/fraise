name: Python SDK

on:
  push:
    branches: [main]
    tags:
      - "python/v[0-9]+.[0-9]+.[0-9]+"
      - "python/v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: -alpha.N / -beta.N / -rc.N
    paths:
      - "sdk/python/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - Dockerfile.fraise
      - docker-compose.yaml
      - mise.toml
      - "uv.lock"
      - "pyproject.toml"
      - "tests/pyproject.toml"
      - "tests/fraise.config.toml"
      - ".github/workflows/python.yaml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - Dockerfile.fraise
      - docker-compose.yaml
      - mise.toml
      - "uv.lock"
      - "pyproject.toml"
      - "tests/pyproject.toml"
      - "tests/fraise.config.toml"
      - ".github/workflows/python.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

jobs:

  lint:
    name: Lint Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install_args: "--locked"
      - name: Lint
        run: mise run lint:py

  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install_args: "--locked"

      # Only the SDK's unit tests, so no server is involved.
      - name: Unit tests with coverage
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: mise run coverage:py

      # Uploaded under the `python` flag so the SDK's coverage is reported
      # separately from the Go server's (see codecov.yaml).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-py.xml
          flags: python

  integration:
    name: Integration tests (${{ matrix.runner }}, py${{ matrix.python }})
    needs: unit
    # The SDK must work against the server image on any architecture a user
    # runs. So every published architecture is crossed with every Python the
    # SDK supports, the same list as the unit job above. The runners are
    # native, so each cell builds and runs the server image for its own
    # architecture.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install_args: "--locked"

      # fraise runs in a container, and Go builds inside the image. pytest
      # runs here, on the matrix's Python.
      - name: Run Python SDK integration tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: mise run test:integration:py

  publish-python:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python/v')
    # integration already requires unit, so this gates on both. Nothing reaches
    # PyPI unless the SDK passed against a live server on amd64 and arm64.
    needs: integration
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing, with no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install_args: "--locked"

      - name: Version must match tag
        run: mise run check:tag:py

      - name: Build and release
        run: mise run release:py
