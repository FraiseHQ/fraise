name: Benchmarks

# Gates a pull request's benchmarks on the newest nightly run of main, the
# baseline benchmarks-nightly.yaml keeps: retrieval quality and allocations
# fail on a regression, time is reported for a reviewer to judge, since the
# baseline was timed on another runner. With no baseline yet the benchmarks
# still run and are reported, and the gate passes. The gates are the pytest
# tests in tests/perf.
#
# The report is posted on the pull request by the gate job itself, and goes to
# benchmarks-report.yaml as an artifact, which posts it to Discord and, for a
# pull request from a fork, on the pull request, with the secrets and the
# write token this workflow does not get there.

on:
  pull_request:
    # labeled, unlabeled and edited re-run the gate when a regression is
    # accepted with the label and the Perf: line, or the acceptance withdrawn.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/perf/**"
      - "tools/embed_locomo.py"
      - ".github/workflows/benchmarks.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Two required checks share this job: the release pull request, which
    # also measures retrieval seeded with embeddings, and any other. The name
    # tells branch protection which one ran.
    name: ${{ startsWith(github.head_ref, 'release-please--') && 'Release gate' || 'Benchmark gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # the nightly baseline
      pull-requests: write # the report, as a sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version-file: "pyproject.toml"

      # No baseline is not an error: the gates then measure and pass. That
      # includes the nightly workflow not existing on main yet, which the
      # action reports as a failed lookup rather than a missing artifact.
      - name: Download the nightly baseline
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: benchmarks-nightly.yaml
          branch: main
          workflow_conclusion: completed
          name: benchmark-baseline
          path: bin/perf/baseline
          search_artifacts: true
          if_no_artifact_found: warn
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vectors
        if: startsWith(github.head_ref, 'release-please--')
        with:
          path: bin/perf/locomo-vectors.json
          key: locomo-vectors-${{ hashFiles('tests/perf/data/locomo-conv-26.json', 'tools/embed_locomo.py') }}

      # A regression fails this step and the check. Until the check is made
      # required (rollout, week 1), that blocks nothing.
      - name: Gate
        env:
          FRAISE_LOCOMO_VECTORS: ${{ steps.vectors.outputs.cache-hit == 'true' && format('{0}/bin/perf/locomo-vectors.json', github.workspace) || '' }}
        run: make bench BENCH_BASELINE=${{ steps.baseline.outputs.found_artifact == 'true' && 'bin/perf/baseline' || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmarks
          path: |
            bin/perf/report.md
            bin/perf/*.txt
      # The report goes on the pull request whatever the verdict. Each run
      # replaces the last one's comment with a new one, so the latest report
      # is at the bottom of the conversation and is the only one there. A pull
      # request from a fork gets a read-only token here, so
      # benchmarks-report.yaml posts its report instead.
      - name: Comment on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('bin/perf/report.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: benchmarks
          recreate: true
          path: bin/perf/report.md
