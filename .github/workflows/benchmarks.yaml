name: Benchmarks

# Compares a change with what it changes, on the same runner in the same job:
# a pull request with its base, the release pull request with the previous
# release. Timings from different runners are never compared, since a hosted
# runner's speed varies more between machines than the regressions worth
# catching; the history recorded on pushes to main is for trends only.
#
# The gates are the pytest tests in tests/perf, on benchdiff and benchstat.
# Their report goes to benchmarks-report.yaml as an artifact, which posts it
# with the secrets this workflow does not get on a pull request from a fork.

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/perf/**"
      - "tools/embed_locomo.py"
      - ".github/workflows/benchmarks.yaml"
  pull_request:
    # labeled, unlabeled and edited re-run the gate when a regression is
    # accepted with the label and the Perf: line, or the acceptance withdrawn.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/perf/**"
      - "tools/embed_locomo.py"
      - ".github/workflows/benchmarks.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compare:
    # Two required checks share this job: the release pull request is gated
    # against the previous release, any other against its base. The name
    # tells branch protection which one ran.
    name: ${{ startsWith(github.head_ref, 'release-please--') && 'Release gate' || 'Compare with base' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE: ${{ startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # the base is checked out from history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version-file: "pyproject.toml"

      # The release gate compares with the last release, and seeds retrieval
      # with the embeddings embed-locomo.yaml cached. Pre-releases are not
      # releases: against an -rc, main would be compared with itself.
      - name: Last release
        id: release
        if: env.RELEASE == 'true'
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vectors
        if: env.RELEASE == 'true'
        with:
          path: bin/perf/locomo-vectors.json
          key: locomo-vectors-${{ hashFiles('tests/perf/data/locomo-conv-26.json', 'tools/embed_locomo.py') }}

      # A regression fails this step and the check. Until the check is made
      # required (rollout, week 1), that blocks nothing.
      - name: Gate
        env:
          FRAISE_LOCOMO_VECTORS: ${{ steps.vectors.outputs.cache-hit == 'true' && format('{0}/bin/perf/locomo-vectors.json', github.workspace) || '' }}
        run: make bench BASE=${{ steps.release.outputs.tag || github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmarks
          path: |
            bin/perf/report.md
            bin/perf/base-*.txt
            bin/perf/head-*.txt

  record:
    name: Record history
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each run reads the history the previous one uploaded and uploads it
    # with its own results appended: one at a time, or two runs would start
    # from the same history and the later upload would drop the other's entry.
    concurrency:
      group: benchmarks-record
      cancel-in-progress: false
    permissions:
      actions: read # the history artifact of the previous run
      contents: write # comments on the commit on an alert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Run both suites
        run: make bench-record

      # The newest history recorded on main; without one, the first run
      # starts it afresh.
      - uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: benchmarks.yaml
          branch: main
          name: benchmark-history
          path: bin/perf/history
          search_artifacts: true
          if_no_artifact_found: warn

      # The history compares a commit with the one recorded before it, on
      # whichever runner each got, so an alert here is a prompt to look, never
      # a failure: the pull request gate is the comparison that decides. Both
      # suites append to the one file, each under its own name.
      - name: Record latency
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Latency
          tool: go
          output-file-path: bin/perf/record-latency.txt
          go-force-package-suffix: true
          external-data-json-path: bin/perf/history/benchmarks.json
          alert-threshold: "125%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record retrieval quality
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Retrieval quality
          tool: customBiggerIsBetter
          output-file-path: bin/perf/record-retrieval.json
          external-data-json-path: bin/perf/history/benchmarks.json
          alert-threshold: "101%"
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-history
          path: bin/perf/history/benchmarks.json
          if-no-files-found: error
          retention-days: 90
