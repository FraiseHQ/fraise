name: Benchmarks

# Gates a pull request's benchmarks on the newest nightly run of main, the
# baseline benchmarks-nightly.yaml keeps. A regression in retrieval quality or
# allocations fails the gate. Time is only reported, for a reviewer to judge,
# because the baseline was timed on another runner. With no baseline yet, the
# benchmarks still run and are reported, and the gate passes. The gates are
# the pytest tests in tests/perf.
#
# The gate job posts the report on the pull request itself. The report also
# goes to benchmarks-report.yaml as an artifact. That workflow posts it to
# Discord, and on a pull request from a fork. It has the secrets and the write
# token, which this workflow does not get on a pull request from a fork.

on:
  # Every pull request, with no paths filter. The gate is a required check,
  # and a required check must report on every pull request. A pull request
  # that changes no benchmarked package runs no benchmark and reports that.
  pull_request:
    # labeled and unlabeled re-run the gate when the label accepts a
    # regression, or when that acceptance is withdrawn. edited re-runs it when
    # the description's Performance regression section changes. The report
    # shows that section as the reason.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # One name on every pull request, the name branch protection requires.
    # The server's release pull request runs every gate. Any other pull
    # request runs the gates its changes can affect.
    name: Benchmark gate
    # benchstat compares only runs on the same CPU, and ubuntu-latest hands
    # out more than one model. Every Arm runner is a Cobalt 100, so this gate
    # and its nightly baseline always share a CPU. The nightly workflow runs
    # on the same label.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      RELEASE: ${{ github.head_ref == 'release-please--branches--main--components--fraise' }}
    permissions:
      contents: read
      actions: read # the nightly baseline
      pull-requests: write # the report, as a sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The checkout is the merge of the pull request into its base.
          # Its first parent is the base, which the gates diff against.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version-file: "pyproject.toml"

      # A missing baseline is not an error. The gates then measure and pass.
      - name: Download the nightly baseline
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: benchmarks-nightly.yaml
          branch: main
          workflow_conclusion: completed
          name: benchmark-baseline
          path: bin/perf/baseline
          search_artifacts: true
          if_no_artifact_found: warn
      # Every gate also measures retrieval seeded with embeddings, so a pull
      # request that changes how the lanes combine is measured both ways. The
      # embeddings come from the cache, or are computed and cached on a miss.
      # If they cannot be computed, the gate measures text only.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vectors
        with:
          path: bin/perf/locomo-vectors.json
          key: locomo-vectors-${{ hashFiles('tests/perf/data/locomo-conv-26.json', 'tools/embed_locomo.py') }}
      - name: Embed LoCoMo
        if: steps.vectors.outputs.cache-hit != 'true'
        continue-on-error: true
        run: make perf-vectors

      # A regression fails this step and the check, and the required check
      # blocks the merge. A pull request runs only the gates whose packages it
      # changes. The release gate runs them all.
      - name: Gate
        env:
          FRAISE_LOCOMO_VECTORS: ${{ hashFiles('bin/perf/locomo-vectors.json') != '' && format('{0}/bin/perf/locomo-vectors.json', github.workspace) || '' }}
          # What the benchmarks run or read that no package's source shows.
          # A change to any of these runs every gate. They are the module's
          # dependencies, the LoCoMo sample, the server configuration the
          # benchmarks start with, and the embeddings they seed with. The
          # gates and what runs them change no number, so they are not here.
          BENCH_ALWAYS: >-
            go.mod
            go.sum
            tests/perf/data/
            tests/perf/fraise.config.toml
            tools/embed_locomo.py
        run: >-
          make bench
          BENCH_BASELINE=${{ steps.baseline.outputs.found_artifact == 'true' && 'bin/perf/baseline' || '' }}
          BENCH_CHANGED_SINCE=${{ env.RELEASE != 'true' && 'HEAD^1' || '' }}
          BENCH_ALWAYS="$BENCH_ALWAYS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmarks
          path: |
            bin/perf/report.md
            bin/perf/*.txt
      # The report goes on the pull request whatever the verdict, and is
      # updated on every push. A pull request from a fork gets a read-only
      # token here, so benchmarks-report.yaml posts its report instead.
      - name: Comment on the pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('bin/perf/report.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: benchmarks
          path: bin/perf/report.md
