name: End-to-end tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC — new CVEs land without commits

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v5
      - name: e2e tests
        run: make test-e2e
