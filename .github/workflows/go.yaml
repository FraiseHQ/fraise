name: Go

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: -alpha.N / -beta.N / -rc.N
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
      - "mise.toml"
      - ".github/workflows/go.yaml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
      - "mise.toml"
      - ".github/workflows/go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}
permissions:
  contents: read

jobs:
  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "--locked"
      - name: Lint
        run: mise run lint:go

  test:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "--locked"

      - name: Test
        run: mise run coverage:go

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          flags: go

  cross-compile:
    name: Cross Platform Compiling
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "--locked"
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: mise run build:go

  publish:
    name: Release
    # Fired by the tag release-please creates when its release PR is merged.
    # release-please must push the tag as fraise-bot. A tag pushed with the
    # default GITHUB_TOKEN does not trigger workflows, so this job would never
    # run (see .github/workflows/release.yaml).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross-compile, test]
    runs-on: ubuntu-latest
    environment: release # manual approval gate
    permissions:
      contents: write
      id-token: write # cosign keyless signing + provenance, both via OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "--locked"
      - name: Tag must be on main
        run: mise run check:tag:go

      # The formula is pushed to FraiseHQ/homebrew-tap, which GITHUB_TOKEN
      # cannot write to. fraise-bot mints a token for that repository alone.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: fraise-bot
        with:
          client-id: ${{ secrets.FRAISE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FRAISE_BOT_PRIVATE_KEY }}
          owner: FraiseHQ
          repositories: homebrew-tap
          permission-contents: write

      # No changelog is built here. release-please already created the GitHub
      # Release, and its notes are the entry release-please added to
      # docs/changelog.md. GoReleaser only appends binaries and checksums to
      # it (release.mode: keep-existing).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.fraise-bot.outputs.token }}
        run: mise run release:go

      - name: Attest release binaries
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*.tar.gz, dist/*.zip, dist/checksums.txt

      - name: Attach provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:go:provenance "${{ steps.attest.outputs.bundle-path }}"
