name: Go

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: -alpha.N / -beta.N / -rc.N
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: "pyproject.toml"
      - name: Lint
        run: make lint-go

  test:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test-go

      - name: Coverage
        run: make coverage-go

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  cross-compile:
    name: Cross Platform Compiling
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make build-go

  publish:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross-compile, test]
    runs-on: ubuntu-latest
    environment: release # manual approval gate
    permissions:
      contents: write
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::bad tag '$GITHUB_REF_NAME' — expected vX.Y.Z or vX.Y.Z-alpha.N/-beta.N/-rc.N"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: .github/changelog-config-server.json
          toTag: ${{ github.ref_name }}
          # HYBRID also lists direct-to-main commits (no PR) as uncategorized
          # entries instead of dropping them.
          mode: "HYBRID"
          includeOnlyPaths: |
            cmd
            internal
            pkg
            docs
            tests
            examples
            assets
            .github
            go.mod
            go.sum
            Makefile
            Dockerfile.fraise
            Dockerfile.e2e
            docker-compose.e2e.yaml
            .goreleaser.yaml
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write notes file
        env:
          NOTES: ${{ steps.changelog.outputs.changelog }}
        run: printf '%s' "$NOTES" > /tmp/release-notes.md
  
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
