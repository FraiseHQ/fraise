name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must match the changelog groups in .goreleaser.yaml
          types: |
            feat
            fix
            perf
            refactor
            chore
            build
            deps
            ci
            docs
            test
            upgrade
            release
          requireScope: false
          # Allow breaking-change marker: feat!: or feat(scope)!:
          headerPattern: '^(\w+)(?:\(([\w\-\.]+)\))?(!)?: (.+)$'
          headerPatternCorrespondence: type, scope, breaking, subject
