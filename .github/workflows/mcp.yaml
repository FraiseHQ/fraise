name: MCP server

on:
  push:
    branches: [main]
    tags:
      - "mcp/v[0-9]+.[0-9]+.[0-9]+"
      - "mcp/v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: -alpha.N / -beta.N / -rc.N
    paths:
      - "mcp/**"
      - "sdk/python/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - Dockerfile.fraise
      - docker-compose.yaml
      - mise.toml
      - ".github/workflows/mcp.yaml"
  pull_request:
    paths:
      - "mcp/**"
      - "sdk/python/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - Dockerfile.fraise
      - docker-compose.yaml
      - mise.toml
      - ".github/workflows/mcp.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

jobs:

  lint:
    name: Lint fraise-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Lint
        run: mise run lint:py

  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # Only the server's unit tests: a mocked client and embedder, so no
      # daemon and no model download.
      - name: Unit tests with coverage
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: mise run coverage:mcp

      # Uploaded under the `mcp` flag so the server's coverage is reported
      # separately from the SDK's and the Go server's (see codecov.yaml).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-mcp.xml
          flags: mcp

  integration:
    name: Integration tests (${{ matrix.runner }}, py${{ matrix.python }})
    needs: unit
    # The command a user runs with uvx, against the daemon image, on every
    # published architecture and every supported Python. Each call launches a
    # fresh server, so the two-turn test restarts it between its remember and
    # its recall, once with vectors and once without as the control.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # fraise runs in a container, and Go builds inside the image. pytest
      # runs here, on the matrix's Python.
      - name: Run fraise-mcp integration tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: mise run test:integration:mcp

  publish-mcp:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/mcp/v')
    # integration already requires unit, so this gates on both. Nothing reaches
    # PyPI unless the server passed against a live daemon on amd64 and arm64.
    needs: integration
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing, with no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Version must match tag
        run: mise run check:tag:mcp

      - name: Build and release
        run: mise run release:mcp
