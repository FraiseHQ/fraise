# Fraise server configuration.
#
# Every setting is optional. A key left commented out falls back to the
# built-in default shown here, and so does every key when this file is missing.
# Flags override the file (fraise -config <path> -log-level error). An
# uncommented key that names no known setting is a startup error, not a typo
# the server ignores. So is a file that is not valid TOML.
#
# Reference: https://docs.getfraise.dev/docs/configuration/overview

[log]
# level = "INFO"              # DEBUG INFO WARN ERROR
# format = "text"             # text json
# disable-timestamp = false   # true drops the time, for journald or docker

[server]
# port = 9876
# read-timeout = "15s"
# read-header-timeout = "5s"
# write-timeout = "15s"
# idle-timeout = "60s"
# shutdown-grace = "10s"
# max-body-bytes = 1048576    # request body cap in bytes (1 MiB)

[scheduler]
# workers = 4                 # default: max(2, GOMAXPROCS(0))
# buffer-size = 200
# enqueue-timeout = "2s"

[engine]
# half-life = "2160h"         # negative disables recency decay, 0 means the default
# cache-capacity = 1000

[db]
# precision = "float32"       # float32 float64
# num-graphs = 8
# default-top = 10
# default-depth = 0
# max-top = 1000
# max-depth = 2
# max-vector-dimension = 4096
# seed-size = 10

[db.aggregate]
# pool = 60                   # ranked candidates a recall's slots are spread from
# cap = 1                     # fact hits one facet takes before the next facet gets its first

[db.hashing-function]
# name = "xxhash"             # xxhash t1ha
# seed = 0

[db.search-algorithm]
# name = "excess"             # none bfs excess

[db.scoring-algorithm]
# name = "excess"             # excess rrf

[db.relevance-model]
# name = "bm25"               # bm25 matchcount

[db.vector-search]
# projection-dimension = 128
# number-trees = 16
# seed = 4
# flush-factor = 2
# leaf-size = 32
# overfetch = 32

[mcp]
# address = "http://127.0.0.1:9876"  # where fraise mcp forwards. Default: 127.0.0.1 on server.port
