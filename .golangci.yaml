version: "2"

run:
  timeout: 5m

linters:
  disable:
    - contextcheck
    - exhaustruct
  enable:
    - govet
    - bodyclose
    - dupl
    - gocritic
    - gocyclo
    - revive
  settings:
    revive:
      # Listing rules replaces revive's defaults, so revive runs only these
      # two. pkg.go.dev renders what go doc renders, and an undocumented
      # package or exported name shows up there as a bare signature.
      rules:
        - name: package-comments
        - name: exported
          # Stutter (config.ConfigSet) is a naming choice, not a documentation
          # gap. Renaming exported types is outside this rule's scope.
          arguments:
            - disableStutteringCheck
