codecov:
  require_ci_to_pass: no
  # master should be the baseline for reporting
  branch: master

comment:
  layout: "diff, flags, files"
  behavior: default

coverage:
  range: 50..80
  round: down
  precision: 0

  status:
    project:
      default:
        target: 70
    patch:
      default:
        target: auto
        threshold: 5
