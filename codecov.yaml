codecov:
  require_ci_to_pass: no

# One flag per component, so the Go server and the Python SDK are reported
# separately. Otherwise they average into one misleading number. carryforward
# matters because the workflows are path-filtered. Some PRs skip one of them,
# such as go.yaml on an SDK-only PR. Without carryforward, that component's
# coverage would read as a drop to zero.
flags:
  go:
    paths:
      - cmd/
      - internal/
      - pkg/
    carryforward: true
  python:
    paths:
      - sdk/python/
    carryforward: true
  mcp:
    paths:
      - mcp/
    carryforward: true

comment:
  layout: "diff, flags, files"
  behavior: default

coverage:
  range: 50..80
  round: down
  precision: 0

  status:
    project:
      default:
        target: 70
    patch:
      default:
        target: 20%
        threshold: 5
