codecov:
  require_ci_to_pass: no

# One flag per component so the Go server and the Python SDK are reported
# separately instead of averaging into a single misleading number.
# carryforward matters because the workflows are path-filtered: on a PR that
# does not run one of them (go.yaml on an SDK-only PR, say), that component's
# coverage would otherwise read as a drop to zero.
flags:
  go:
    paths:
      - cmd/
      - internal/
      - pkg/
    carryforward: true
  python:
    paths:
      - sdk/python/
    carryforward: true

comment:
  layout: "diff, flags, files"
  behavior: default

coverage:
  range: 50..80
  round: down
  precision: 0

  status:
    project:
      default:
        target: 70
    patch:
      default:
        target: 20%
        threshold: 5
