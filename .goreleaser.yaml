version: 2

project_name: fraise

before:
  hooks:
    - go mod tidy
    # Refuse to release if pkg/version disagrees with the tag. release-please
    # rewrites Version in the commit it tags. If the x-release-please-version
    # annotation breaks or moves off the literal's line, release-please stops
    # updating the file without an error. Builds that skip the ldflags below
    # (go install ...@vX.Y.Z, the docker image) would then report a stale
    # version. Snapshots skip this check, because their version is not a tag.
    - sh -c "{{ if .IsSnapshot }}true{{ else }}grep -q 'Version = \"{{ .Version }}\"' pkg/version/version.go || { echo 'pkg/version/version.go does not declare {{ .Version }} (tag {{ .Tag }}) — check the x-release-please-version annotation'; exit 1; }{{ end }}"

builds:
  - id: fraise
    main: ./cmd/server
    binary: fraise
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/FraiseHQ/fraise/pkg/version.Version={{ .Version }}
      - -X github.com/FraiseHQ/fraise/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/FraiseHQ/fraise/pkg/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Setting files replaces the default list, so LICENSE and README are named
    # explicitly. The default config ships in the archive so the brew formula
    # can install it under etc/. The packages ship their own copy through
    # nfpms.
    files:
      - LICENSE
      - README.md
      - src: fraise.config.toml
        dst: fraise.config.toml

# fraise as a managed local service, like Postgres or Redis. brews is
# deprecated since GoReleaser v2.10 in favour of homebrew_casks. Only a formula
# carries the service block that `brew services start fraise` needs, so the
# deprecation is accepted. CI runs `release`, which warns, never `check`, which
# fails on it. The formula lands in the tap the README installs from
# (fraisehq/tap). keep_alive restarts the daemon after a crash, and its logs go
# to var/log/. The config install is upgrade-safe. An existing, user-edited
# config stays in place, and the new default lands beside it as .default.
brews:
  - name: fraise
    repository:
      owner: FraiseHQ
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/FraiseHQ/fraise
    description: In-memory temporal graph database for AI agents memory
    license: MIT
    # Use (etc/"fraise").install, not etc.install "x" => "fraise/x".
    # Pathname#install creates only its receiver directory, so the rename form
    # fails with ENOENT when etc/fraise does not exist yet. The receiver form
    # creates it, and keeps the upgrade-safe .default behaviour for an
    # existing, user-edited config.
    install: |
      bin.install "fraise"
      (etc/"fraise").install "fraise.config.toml"
    service: |
      run [opt_bin/"fraise", "-config", etc/"fraise/fraise.config.toml"]
      keep_alive true
      log_path var/"log/fraise.log"
      error_log_path var/"log/fraise.log"
      working_dir var
    caveats: |
      Run fraise as a supervised background service:
        brew services start fraise
      Config:  #{etc}/fraise/fraise.config.toml
      Logs:    #{var}/log/fraise.log
    test: |
      assert_match "-config", shell_output("#{bin}/fraise -h 2>&1")

# .deb and .rpm packages that match the brew service, from the same tag and
# build matrix. The systemd user unit ships to the vendor unit directory, so
# `systemctl --user enable --now fraise` works right after install. The default
# config is marked config|noreplace, so upgrades never overwrite edits.
nfpms:
  - package_name: fraise
    ids: [fraise]
    vendor: FraiseHQ
    homepage: https://github.com/FraiseHQ/fraise
    maintainer: René-Jean Corneille <corneille.r.j@gmail.com>
    description: In-memory temporal graph database for AI agents memory.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    scripts:
      postinstall: packaging/deb/postinst
    contents:
      - src: packaging/systemd/fraise.service
        dst: /usr/lib/systemd/user/fraise.service
      - src: fraise.config.toml
        dst: /etc/fraise/fraise.config.toml
        type: config|noreplace

checksum:
  name_template: checksums.txt

# Keyless cosign signing of checksums.txt only. It lists every archive and
# package, so one signature covers the whole set. The output is
# checksums.txt.sigstore.json, a Sigstore bundle that holds the signature and
# the signing certificate. .sigstore.json is one of the suffixes OpenSSF
# Scorecard's Signed-Releases check looks for. Signing needs cosign on PATH and
# id-token: write on the publishing job (see .github/workflows/go.yaml).
# Without the OIDC token, signing fails the release rather than shipping it
# unsigned.
#
# --bundle is the only output flag to use here. cosign 3, which
# sigstore/cosign-installer v4 installs, defaults to --new-bundle-format. That
# format ignores --output-signature and --output-certificate. With no bundle
# path to write, cosign resolves an empty filename and aborts the release.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  groups:
    - title: Upgrades
      regexp: '^[a-z]+(\(.*\))?!:|^upgrade(\(.*\))?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.*\))?:'
      order: 3
    - title: Maintenance
      regexp: '^(chore|build|deps|ci|refactor)(\(.*\))?:'
      order: 4
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: FraiseHQ
    name: fraise
  # release-please creates the GitHub Release and owns its notes. GoReleaser
  # only attaches binaries to it. keep-existing leaves those notes untouched
  # however many times the publish job runs. append and prepend would add
  # GoReleaser's own notes on every run, and replace would overwrite them.
  mode: keep-existing
  draft: false
  prerelease: auto # vX.Y.Z-alpha.N / -beta.N / -rc.N auto-marked as pre-release

# Announces the release on Discord, with the webhook GoReleaser reads from
# DISCORD_WEBHOOK_ID and DISCORD_WEBHOOK_TOKEN.
announce:
  discord:
    enabled: true
    message_template: >-
      🍓 Fraise {{ .Tag }} is out!
      {{ .ReleaseURL }}
