version: 2

project_name: fraise

before:
  hooks:
    - go mod tidy
    # Refuse to release if pkg/version disagrees with the tag. release-please
    # rewrites that constant in the same commit it tags, so this should never
    # fire — its job is to catch the one silent failure left: if the
    # x-release-please-version annotation is broken or moved off the literal's
    # line, release-please stops updating the file without erroring, and the
    # version would quietly go stale again for builds that skip the ldflags
    # below (go install ...@vX.Y.Z, the docker image).
    # Skipped for snapshots, whose version is not a tag.
    - sh -c "{{ if .IsSnapshot }}true{{ else }}grep -q 'Version = \"{{ .Version }}\"' pkg/version/version.go || { echo 'pkg/version/version.go does not declare {{ .Version }} (tag {{ .Tag }}) — check the x-release-please-version annotation'; exit 1; }{{ end }}"

builds:
  - id: fraise
    main: ./cmd/server
    binary: fraise
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/RonsenbergVI/fraise/pkg/version.Version={{ .Version }}
      - -X github.com/RonsenbergVI/fraise/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/RonsenbergVI/fraise/pkg/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Upgrades
      regexp: '^[a-z]+(\(.*\))?!:|^upgrade(\(.*\))?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.*\))?:'
      order: 3
    - title: Maintenance
      regexp: '^(chore|build|deps|ci|refactor)(\(.*\))?:'
      order: 4
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: RonsenbergVI
    name: fraise
  # release-please creates the GitHub Release and owns its notes; GoReleaser
  # only attaches binaries to it. Any other mode would overwrite those notes,
  # and the header/footer/changelog blocks below are unused as a result.
  mode: append
  draft: false
  prerelease: auto # vX.Y.Z-alpha.N / -beta.N / -rc.N auto-marked as pre-release
  header: |
    ## Fraise {{ .Tag }}

    See [CHANGELOG.md](https://github.com/RonsenbergVI/fraise/blob/main/CHANGELOG.md)
    for the curated summary.
  footer: |
    **Install**: download a binary below, or `go install github.com/RonsenbergVI/fraise/cmd/fraise@{{ .Tag }}`

# Announcement — Discord enabled; swap to the slack block if you land on Slack.
announce:
  discord:
    enabled: true
    message_template: >-
      🍓 Fraise {{ .Tag }} is out!
      {{ .ReleaseURL }}
