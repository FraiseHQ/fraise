version: 2

project_name: fraise

before:
  hooks:
    - go mod tidy
    # Refuse to release if pkg/version drifted from the tag. Builds that skip
    # the ldflags below — `go install ...@vX.Y.Z`, the docker image — report
    # those constants instead, so a stale value ships as the reported version.
    # The expected values come from GoReleaser's own parse of the tag
    # (.Major/.Minor/.Patch/.Prerelease), so there is no version parsing here;
    # Patch carries the pre-release suffix, e.g. 0-alpha.3 for v0.1.0-alpha.3.
    # Skipped for snapshots, whose version is not a tag.
    - sh -c "{{ if .IsSnapshot }}true{{ else }}grep -q 'Major = {{ .Major }}[[:space:]]*$' pkg/version/version.go && grep -q 'Minor = {{ .Minor }}[[:space:]]*$' pkg/version/version.go && grep -q 'Patch = \"{{ .Patch }}{{ with .Prerelease }}-{{ . }}{{ end }}\"' pkg/version/version.go || { echo 'pkg/version/version.go does not match {{ .Tag }} — bump Major/Minor/Patch before tagging'; exit 1; }{{ end }}"

builds:
  - id: fraise
    main: ./cmd/server
    binary: fraise
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/RonsenbergVI/fraise/pkg/version.Version={{ .Version }}
      - -X github.com/RonsenbergVI/fraise/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/RonsenbergVI/fraise/pkg/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Upgrades
      regexp: '^[a-z]+(\(.*\))?!:|^upgrade(\(.*\))?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.*\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.*\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.*\))?:'
      order: 3
    - title: Maintenance
      regexp: '^(chore|build|deps|ci|refactor)(\(.*\))?:'
      order: 4
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: RonsenbergVI
    name: fraise
  draft: false
  prerelease: auto # vX.Y.Z-alpha.N / -beta.N / -rc.N auto-marked as pre-release
  header: |
    ## Fraise {{ .Tag }}

    See [CHANGELOG.md](https://github.com/RonsenbergVI/fraise/blob/main/CHANGELOG.md)
    for the curated summary.
  footer: |
    **Install**: download a binary below, or `go install github.com/RonsenbergVI/fraise/cmd/fraise@{{ .Tag }}`

# Announcement — Discord enabled; swap to the slack block if you land on Slack.
announce:
  discord:
    enabled: true
    message_template: >-
      🍓 Fraise {{ .Tag }} is out!
      {{ .ReleaseURL }}
