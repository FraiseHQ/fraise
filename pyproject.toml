[project]
name = "fraise"
version = "0.1.0"
description = "Fraise repository."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
dependencies = [
    "pre-commit>=4.6.1",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
required-version = ">0.9,<0.12"

[tool.uv.workspace]
members = [
    "tests",
    "sdk/python"
]

[tool.pytest.ini_options]
minversion = "8.0"
# importlib import mode: the test tree mirrors the package one-to-one in every
# suite, so the same basename recurs (sdk/python/src/tests/client_test.py and
# tests/integration/python/client_test.py). The default 'prepend' mode fails to
# collect the second of any such pair; importlib imports each by full path.
addopts = ["-ra", "-q", "--capture=no", "-vvv", "--import-mode=importlib"]

[tool.ruff.lint]
preview = true
select = [
    "E",
    "I",
    "F",
    "W",
    "N",
    "I001",
    "I002",
    "ANN",
    "D",
    "DOC",
    "AIR",
    "UP",
    "S102",
    "TID252", # relative imports only allowed for siblings
    "PT"
]
ignore = [
    "E501", # over-length lines, formatter should handle it
    "E741", # ambigous variable name
    "ANN401",
    "D401",
    "D211",
    "D213",
    "DOC201",
    "D203",
    "D107", # no docstring for __init__
    "D415", # duplicate of D400
    "ANN002", # args type hint
    "ANN003", # kwargs type hint
    "PT006",
    "D105", # docstrings for magic methods
    "UP017",
    "E731"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"**/tests/**" = ["ANN", "D"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "ignore"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty.src]
include = [
    "sdk/python",
    "tests",
]
