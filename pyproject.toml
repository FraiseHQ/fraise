[project]
name = "fraise"
version = "0.1.0"
description = "Fraise repository."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
dependencies = [
    "pre-commit>=4.6.1",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
required-version = ">0.9,<0.12"

[tool.uv.workspace]
members = [
    "tests",
    "sdk/python"
]

[tool.pytest]
minversion = "8.0"
addopts = ["-ra", "-q", "--capture=no", "-vvv"]
