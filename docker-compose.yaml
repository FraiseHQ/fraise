# The fraise server as it ships, for the test suites to drive.
#
# `make test-e2e` and `make test-integration-py` both start it detached. They
# run pytest locally against the published port, so neither suite needs a
# test-runner image of its own.
services:
  fraise:
    build:
      context: .
      dockerfile: Dockerfile.fraise
    ports:
      - "${FRAISE_PORT:-9877}:9876"
    volumes:
      - ./tests/fraise.config.toml:/etc/fraise/fraise.config.toml:ro
    command: ["-config", "/etc/fraise/fraise.config.toml"]
