[scheduler]
workers = 4
buffer-size = 128

[server]
port = 9876

[log]
level = "INFO"
format = "json"
disable-timestamp = true

[engine]
# Let a recall match on keywords alone, without anchoring to an entity/topic —
# the agent recalls by free keywords.
allow-unanchored-recall = true
half-life = "168h"
cache-capacity = 1024

[db]
precision = "float32"
default-top = 10
default-depth = 3
seed-size = 64
rrf-k = 90

[db.hashing-function]
name = "xxhash"
