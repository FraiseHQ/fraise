[project]
name = "tests"
version = "0.1.0"
description = "End-to-end and integration suites for the fraise binary"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pytest>=9.0.1",
    "requests>=2.32.5",
]

# Optional. Only the `embeddings`-marked test and `make perf-vectors` need it.
# Both load a real HuggingFace model through the vanilla transformers API. It
# stays out of the base deps so the default e2e run stays torch-free. Install
# it with `uv sync --extra embeddings`.
[project.optional-dependencies]
embeddings = [
    "transformers>=5.19.0",
    "torch>=2.14.1",
]

# On Linux, pull torch from PyTorch's CPU wheel index. An install then gets the
# ~200MB CPU build, not the default PyPI wheel with ~2GB of CUDA libraries.
# macOS torch is already CPU-only, so it stays on PyPI there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q", "--capture=no", "-vvv"]
