[scheduler]
workers = 4
buffer-size = 128

[server]
port = 9876

[log]
level = "DEBUG"
format = "json"
disable-timestamp = true

[engine]
half-life = "2160h"
cache-capacity = 1024

[db]
num-graphs = 10
precision = "float64"
default-top = 10
default-depth = 2
seed-size = 64
# The suite pins the plain pipeline: one fact scored on its own terms and one
# slot per fact. The window and the grouping, on by default, are off here;
# their own coverage is the Go suite, which turns them on per test.
window-gamma = -1

[db.aggregate]
name = "none"

[db.hashing-function]
name = "xxhash"
