[scheduler]
workers = 4
buffer-size = 128

[server]
port = 9876

[log]
level = "DEBUG"
format = "json"
disable-timestamp = true

[engine]
allow-unanchored-recall = true
half-life = "168h"
cache-capacity = 1024

[db]
precision = "float64"
default-top = 10
default-depth = 2
seed-size = 64

[db.hashing-function]
name = "xxhash"
