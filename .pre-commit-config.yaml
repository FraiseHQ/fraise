repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=700']
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        auto-correct: true
        args: ['--fix=lf']
      - id: check-json
        name: Check JSON syntax

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
    # -full lints the whole module. The plain hook lints only the diff against
    # HEAD, which is empty in CI.
    - id: golangci-lint-full

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
    - id: ruff
      args: [ --fix, --config=pyproject.toml, --show-fixes ]
    - id: ruff-format
      args: [--config=pyproject.toml]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.64
    hooks:
    - id: ty
      args: [--no-default-groups]

  # The hook's default types: [dockerfile] does not match the Dockerfile.<name>
  # filenames used here, so types: [file] and files override it.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        types: [file]
        files: (^|/)Dockerfile[^/]*$
