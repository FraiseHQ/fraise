[project]
name = "fraise-sdk"
version = "0.3.0"
description = "Fraise SDK"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.1",
]

[project.optional-dependencies]
openai = [
    "openai-agents>=0.24.0",
]
anthropic = [
    "claude-agent-sdk>=0.2.168",
]
huggingface = [
    "huggingface-hub>=1.27.0",
]
# onnxruntime ships no Intel macOS wheel from 1.24 on. fastembed accepts 1.23
# before Python 3.14, so an Intel Mac stays there and the lock carries a
# version it can install.
fastembed = [
    "fastembed>=0.9.1",
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.14'",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
