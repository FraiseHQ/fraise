[project]
name = "fraise-sdk"
version = "0.1.0-beta.3"
description = "Fraise SDK"
readme = "README.md"
authors = [
    { name = "René-Jean Corneille", email = "corneille.r.j@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
anthropic = [
    "claude-agent-sdk>=0.2.134",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]
huggingface = [
    "huggingface-hub>=1.27.0",
]
openai = [
    "openai-agents>=0.19.4",
]
