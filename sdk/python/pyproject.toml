[project]
name = "fraise-sdk"
version = "0.0.1"
description = "Fraise SDK"
authors = [
    { name = "Rene Jean Corneille", email = "14303619+RonsenbergVI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
crewai = [
    "crewai>=1.6.1",
]
dev = [
    "pytest>=9.0.3",
]
langchain = [
    "langchain>=1.2.17",
]
pydantic-ai = [
    "pydantic-ai>=1.89.0",
]
